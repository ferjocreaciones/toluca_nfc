<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Club Toluca NFC</title>
<style>
body{font-family:Arial;background:linear-gradient(180deg,#5a000c,#9e0015,#d5001c,#fff);color:#fff;text-align:center;margin:0}
.container{padding:20px}
.card-fc{position:relative;width:92%;max-width:360px;height:530px;margin:20px auto;border-radius:28px;overflow:hidden;box-shadow:0 0 35px rgba(255,255,255,.25)}
.card-bg{position:absolute;inset:0;background:linear-gradient(135deg,#7a0011,#d5001c,#fff,#c9a227)}
.card-player{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:90%;height:320px;object-fit:cover;border-radius:20px;z-index:2}
.card-info{position:absolute;bottom:0;width:100%;padding:18px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.92));z-index:3}
.btn{display:block;width:90%;max-width:360px;margin:12px auto;padding:16px;border-radius:18px;text-decoration:none;font-weight:bold;background:linear-gradient(135deg,#d5001c,#fff);color:#111}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="card-fc">
<div class="card-bg"></div>
<img id="player-img" class="card-player" src="toluca-club.jpg" alt="Toluca">
<div class="card-info">
<div id="card-name" style="font-size:28px;font-weight:bold;">Club Deportivo Toluca</div>
<div>🔴 Diablos Rojos • ⚽ Liga MX</div>
</div>
</div>

<div id="player-buttons">
<a id="btn-instagram" class="btn" href="#">📸 Instagram Oficial</a>
<a id="btn-highlights" class="btn" href="#">🎥 Mejores Momentos</a>
<a id="btn-stats" class="btn" href="#">📊 Estadísticas del Jugador</a>
<a id="btn-history" class="btn" href="#">⭐ Trayectoria</a>
</div>

<a class="btn" href="https://tolucafc.com">🌐 Sitio Oficial</a>
<a class="btn" href="https://www.instagram.com/tolucafc">📸 Instagram Oficial del Club</a>
<a class="btn" href="https://www.youtube.com/@TolucaFC">▶️ YouTube Oficial</a>
<a class="btn" href="https://www.google.com/search?q=toluca+proximo+partido">📅 Próximo Partido</a>
<a class="btn" href="https://www.google.com/search?q=toluca+calendario">🗓️ Calendario</a>
<a class="btn" href="https://www.google.com/search?q=tabla+liga+mx">📊 Tabla Liga MX</a>
<a class="btn" href="https://www.google.com/search?q=palmares+toluca">🏆 Palmarés</a>
<a class="btn" href="https://www.google.com/search?q=estadio+nemesio+diez">🏟️ Estadio Nemesio Díez</a>
</div>

<script>
const players = {
vega:{
name:"Alexis Vega",
image:"vega.png",
instagram:"https://www.instagram.com/tolucafc",
highlights:"https://www.youtube.com/results?search_query=alexis+vega+toluca",
stats:"https://www.google.com/search?q=alexis+vega+estadisticas",
history:"https://www.google.com/search?q=alexis+vega+trayectoria"
},
paulinho:{
name:"Paulinho",
image:"paulinho.png",
instagram:"https://www.instagram.com/tolucafc",
highlights:"https://www.youtube.com/results?search_query=paulinho+toluca",
stats:"https://www.google.com/search?q=paulinho+toluca+estadisticas",
history:"https://www.google.com/search?q=paulinho+toluca+trayectoria"
}
};

const params = new URLSearchParams(window.location.search);
const playerKey = params.get("player");

if(playerKey && players[playerKey]){
 const p = players[playerKey];
 document.title = p.name + " | Toluca NFC";
 document.getElementById("card-name").innerText = p.name;
 document.getElementById("player-img").src = p.image;
 document.getElementById("btn-instagram").href = p.instagram;
 document.getElementById("btn-highlights").href = p.highlights;
 document.getElementById("btn-stats").href = p.stats;
 document.getElementById("btn-history").href = p.history;
}else{
 document.getElementById("player-buttons").classList.add("hidden");
}
</script>
</body>
</html>
